name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create keystore.properties
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          echo "$KEYSTORE_PROPERTIES" | base64 -d > keystore.properties

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Generate release message
        id: message
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          sed "s/{version}/$VERSION/" fastlane/release_message_template.md > /tmp/sbskip-release-message.md
          echo "path=/tmp/sbskip-release-message.md" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.message.outputs.tag }}
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              -F "${{ steps.message.outputs.path }}"
            echo "Created GitHub Release $TAG"
          else
            echo "GitHub Release $TAG already exists, skipping creation"
          fi

      - name: Upload APKs as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.message.outputs.tag }}
          APK_DIR=app/build/outputs/apk/release
          mapfile -t APKS < <(ls "$APK_DIR"/*.apk 2>/dev/null)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "No release APKs found in $APK_DIR" >&2
            exit 1
          fi
          gh release upload "$TAG" "${APKS[@]}" --clobber
