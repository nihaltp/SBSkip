name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: ktlint check
        run: ./gradlew ktlintCheck
      - name: Unit tests
        run: ./gradlew test
      - name: Build debug APK
        run: ./gradlew assembleDebug

  # Instrumented tests (opt-in: set to true or trigger manually)
  instrumented:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v3
      - name: Start emulator
        uses: android-actions/start-emulator@v3
        with:
          api-level: 30
          arch: arm64
          force-avd-creation: true
      - name: Run instrumented tests
        run: ./gradlew connectedAndroidTest
